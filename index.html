<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game - v0.0.1</title>
    <style>
        /* Modernes Dark-Mode Design */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none; /* Verhindert unschönes Markieren beim schnellen Klicken */
        }

        .game-container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .version {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 30px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #ffffff;
        }

        /* Der Haupt-Klick-Button */
        .click-button {
            background: linear-gradient(135deg, #00ffcc, #0077ff);
            border: none;
            color: #121212;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 20px 40px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        /* Animation beim Drüberfahren und Klicken */
        .click-button:hover {
            box-shadow: 0 5px 25px rgba(0, 255, 204, 0.6);
        }

        .click-button:active {
            transform: scale(0.95); /* Button wird beim Klick kurz minimal kleiner */
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Klicker Spiel</h1>
        <div class="version">Release 0.0.1</div>
        
        <!-- Hier werden die Punkte angezeigt -->
        <div class="score-display" id="score">0</div>
        
        <!-- Der Button zum Klicken -->
        <button class="click-button" id="clickBtn">KLICK MICH!</button>
    </div>

    <script>
        // Spiel-Logik (JavaScript)
        let score = 0;

        const scoreDisplay = document.getElementById('score');
        const clickButton = document.getElementById('clickBtn');

        // Funktion, die beim Klick ausgeführt wird
        clickButton.addEventListener('click', () => {
            score = score + 1; // Erhöhe die Punkte um 1
            scoreDisplay.textContent = score; // Aktualisiere die Anzeige auf der Webseite
        });
    </script>

</body>
</html>
